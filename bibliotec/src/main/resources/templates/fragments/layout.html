<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeca(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | BiblioTec'">BiblioTec</title>
    <link rel="stylesheet" th:href="@{/css/categorias.css}">
</head>
<body>

<nav class="menu" th:fragment="menu(ativo)">
    <a th:href="@{/}" th:classappend="${ativo == 'inicio'} ? 'ativo'">Início</a>
    <a th:href="@{/categorias}" th:classappend="${ativo == 'categorias'} ? 'ativo'">Categorias</a>
    <a th:href="@{/livros}" th:classappend="${ativo == 'livros'} ? 'ativo'">Livros</a>
    <a th:href="@{/leitores}" th:classappend="${ativo == 'leitores'} ? 'ativo'">Leitores</a>
</nav>

</body>
</html>
