
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabeca('Leitores')}"></head>
<body>

<nav th:replace="~{fragments/layout :: menu('leitores')}"></nav>

<div class="layout">
    <aside class="sidebar">
        <div class="logo">
            <span class="logo-icone">🪭</span>
            <h2>BiblioTec</h2>
            <p>Sistema de biblioteca escolar</p>
        </div>

        <div class="sidebar-rodape">
            <p>🪭 📚 🪭</p>
        </div>
    </aside>

    <main class="conteudo">

        <header class="topo">
            <div>
                <p class="subtitulo">GERENCIAMENTO</p>
                <h1 th:text="${leitor.id == null ? 'Novo leitor' : 'Editar leitor'}">
                    Novo leitor
                </h1>
                <p class="descricao">Preencha os dados do leitor.</p>
            </div>
        </header>

        <div class="linha-arco-iris"></div>

        <section class="painel">
            <form th:object="${leitor}"
                  th:action="${leitor.id == null ? '/leitores' : '/leitores/' + leitor.id}"
                  method="post"
                  class="formulario">

                <div>
                    <label for="nome">Nome *</label>
                    <input type="text"
                           id="nome"
                           th:field="*{nome}"
                           maxlength="100"
                           placeholder="Digite o nome completo"
                           th:classappend="${#fields.hasErrors('nome')} ? 'campo-erro'">
                    <p class="erro"
                       th:if="${#fields.hasErrors('nome')}"
                       th:errors="*{nome}"></p>
                </div>

                <div>
                    <label for="matricula">Matrícula *</label>
                    <input type="text"
                           id="matricula"
                           th:field="*{matricula}"
                           maxlength="20"
                           placeholder="Digite a matrícula"
                           th:classappend="${#fields.hasErrors('matricula')} ? 'campo-erro'">
                    <p class="erro"
                       th:if="${#fields.hasErrors('matricula')}"
                       th:errors="*{matricula}"></p>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           maxlength="100"
                           placeholder="Digite o e-mail (opcional)"
                           th:classappend="${#fields.hasErrors('email')} ? 'campo-erro'">
                    <p class="erro"
                       th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"></p>
                </div>

                <div>
                    <label for="tipo">Tipo de leitor *</label>
                    <select id="tipo"
                            th:field="*{tipo}"
                            th:classappend="${#fields.hasErrors('tipo')} ? 'campo-erro'">
                        <option value="">Selecione o tipo</option>
                        <option th:each="tipo : ${tipos}"
                                th:value="${tipo}"
                                th:text="${tipo.rotulo}">
                        </option>
                    </select>
                    <p class="erro"
                       th:if="${#fields.hasErrors('tipo')}"
                       th:errors="*{tipo}"></p>
                </div>

                <div class="acoes">
                    <button type="submit" class="botao botao-principal">
                        Salvar
                    </button>

                    <a th:href="@{/leitores}" class="botao botao-limpar">
                        Cancelar
                    </a>
                </div>

            </form>
        </section>

        <footer class="rodape">
            BiblioTec · 🪭 📚 🪭
        </footer>

    </main>
</div>

</body>
</html>
